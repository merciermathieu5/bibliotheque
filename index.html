<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibliothèque de M. Univers social</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Courier+Prime:wght@400;700&amp;display=swap"><style>
/* Fichier de bibliothèque : barre de recherche en haut, tiroirs de filtres à gauche, rayon de couvertures à droite, fiche cartonnée qui glisse depuis la droite */
:root{
  --papier:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EBF0; --encre:#151C27; --encre-2:#55606F; --filet:#D3DAE2; --filet-fort:#B3BDC9;
  --tampon:#5A3FA6; --tampon-fort:#462F88; --tampon-fond:#ECE7F8; --sur-tampon:#FFFFFF;
  --ok:#16714A; --ok-fond:#E1F2E8; --alerte:#B3261E; --alerte-fond:#FBE6E3; --attention:#8C5006; --attention-fond:#FAEFD9;
  --voile:rgba(21,28,39,.46); --ombre:0 1px 2px rgba(21,28,39,.07),0 10px 28px rgba(21,28,39,.11);
  --trame:rgba(255,255,255,.18); --ligne-fiche:rgba(179,38,30,.55); --reglure:rgba(35,87,181,.13); --dos:rgba(0,0,0,.22);
  --c-manga:#C8412F; --c-bd:#2357B5; --c-rg:#1C6E6A; --c-jeu:#A86F0A; --c-ref:#4A6B2A; --c-roman:#7B3F6E; --c-autre:#5C6575; --sur-couv:#FFFFFF;
  --f-titre:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-texte:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-fiche:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:6px; --r-grand:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papier:#10141B; --surface:#181E28; --surface-2:#232B37; --encre:#E7EBF1; --encre-2:#9CA7B7; --filet:#2D3644; --filet-fort:#435064;
    --tampon:#B6A3F5; --tampon-fort:#CFC1FB; --tampon-fond:#2A2342; --sur-tampon:#17102B;
    --ok:#62D49D; --ok-fond:#123020; --alerte:#FF9184; --alerte-fond:#3B1714; --attention:#F0B55E; --attention-fond:#33240D;
    --voile:rgba(0,0,0,.62); --ombre:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.38);
    --trame:rgba(255,255,255,.11); --ligne-fiche:rgba(255,145,132,.5); --reglure:rgba(140,170,230,.10); --dos:rgba(0,0,0,.3);
    --c-manga:#B53B2B; --c-bd:#2B5DB8; --c-rg:#1F7672; --c-jeu:#A06A0B; --c-ref:#4F7330; --c-roman:#80456F; --c-autre:#4E5768; --sur-couv:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papier:#10141B; --surface:#181E28; --surface-2:#232B37; --encre:#E7EBF1; --encre-2:#9CA7B7; --filet:#2D3644; --filet-fort:#435064;
  --tampon:#B6A3F5; --tampon-fort:#CFC1FB; --tampon-fond:#2A2342; --sur-tampon:#17102B;
  --ok:#62D49D; --ok-fond:#123020; --alerte:#FF9184; --alerte-fond:#3B1714; --attention:#F0B55E; --attention-fond:#33240D;
  --voile:rgba(0,0,0,.62); --ombre:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.38);
  --trame:rgba(255,255,255,.11); --ligne-fiche:rgba(255,145,132,.5); --reglure:rgba(140,170,230,.10); --dos:rgba(0,0,0,.3);
  --c-manga:#B53B2B; --c-bd:#2B5DB8; --c-rg:#1F7672; --c-jeu:#A06A0B; --c-ref:#4F7330; --c-roman:#80456F; --c-autre:#4E5768; --sur-couv:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--f-texte);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-fiche);font-variant-numeric:tabular-nums}
.app{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
@media (min-width:720px){.app{padding-inline:24px}}

/* En-tête */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--papier);padding-block:14px 0;border-bottom:1px solid var(--filet)}
.entete-haut{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.marque{flex:1 1 240px;min-width:0}
.marque h1{margin:0;font-family:var(--f-titre);font-stretch:76%;font-weight:800;font-size:clamp(1.55rem,1.15rem + 1.5vw,2.15rem);line-height:1.02;letter-spacing:-.005em;text-wrap:balance;overflow-wrap:anywhere}
.sous-titre{margin:3px 0 0;color:var(--encre-2);font-family:var(--f-fiche);font-size:.84rem}
.recherche{position:relative;flex:1 1 320px;min-width:0;order:2}
.recherche svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--encre-2);pointer-events:none}
.recherche input{width:100%;min-height:44px;padding:9px 44px 9px 40px;border:1px solid var(--filet-fort);border-radius:999px;background:var(--surface);color:var(--encre);font-size:1rem}
.recherche input:focus{outline:none;border-color:var(--tampon);box-shadow:0 0 0 3px var(--tampon-fond)}
.recherche kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-fiche);font-size:.75rem;color:var(--encre-2);border:1px solid var(--filet-fort);border-radius:4px;padding:0 6px;background:var(--papier)}
.actions{display:flex;align-items:center;gap:8px;order:3}
@media (max-width:719px){.recherche{order:4;flex-basis:100%}.recherche kbd{display:none}}
.onglets{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.onglet{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.8rem;padding:9px 14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--encre-2);margin-bottom:-1px;white-space:nowrap}
.onglet[aria-selected="true"]{background:var(--surface);border-color:var(--filet);color:var(--encre)}
.onglet .nb{font-family:var(--f-fiche);font-weight:700;letter-spacing:0;text-transform:none;font-size:.78rem;padding:0 6px;border-radius:999px;background:var(--surface-2)}
.onglet .nb.alerte{background:var(--alerte-fond);color:var(--alerte)}
.bandeau{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--tampon-fond);color:var(--encre);font-size:.92rem}
.bandeau.alerte{background:var(--alerte-fond)}
.bandeau p{margin:0;flex:1 1 280px;min-width:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--filet-fort);background:var(--surface);color:var(--encre);font-weight:700;font-size:.9rem;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn-primaire{background:var(--tampon);border-color:var(--tampon);color:var(--sur-tampon)}
.btn-primaire:hover{background:var(--tampon-fort);border-color:var(--tampon-fort)}
.btn-discret{background:transparent;border-color:transparent}
.btn-discret:hover{background:var(--surface-2)}
.btn-danger{color:var(--alerte);border-color:var(--alerte)}
.btn-danger:hover{background:var(--alerte-fond)}
.btn-petit{min-height:32px;padding:4px 10px;font-size:.83rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg,.menu svg{width:17px;height:17px;flex:none}
@media (max-width:480px){.btn .txt-long{display:none}}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-grand);box-shadow:var(--ombre);padding:6px;z-index:45;display:flex;flex-direction:column}
.menu button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:6px;font-size:.92rem;color:var(--encre)}
.menu button:hover{background:var(--surface-2)}
.menu button small{display:block;color:var(--encre-2);font-size:.78rem}
.menu hr{border:0;border-top:1px solid var(--filet);margin:6px 4px}

/* Corps du catalogue */
.corps{display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;padding-top:22px}
.filtres{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--h-entete,150px) + 12px);max-height:calc(100vh - var(--h-entete,150px) - 24px);overflow:auto;padding-right:4px;padding-bottom:16px}
.filtres-tete{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.filtres-tete h2{margin:0;font-family:var(--f-titre);font-stretch:80%;font-weight:800;font-size:1.3rem}
.bouton-filtres{display:none}
@media (max-width:899px){
  .corps{grid-template-columns:minmax(0,1fr)}
  .filtres{display:none}
  .filtres.ouvert{display:block;position:fixed;inset:0;z-index:55;max-height:none;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .filtres.ouvert .filtres-tete{display:flex}
  .bouton-filtres{display:inline-flex}
}
.tiroir{border-top:1px solid var(--filet);padding-block:12px}
.tiroir:first-of-type{border-top:0;padding-top:0}
.tiroir h2{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--encre-2)}
.tiroir h2 button{font:inherit;font-family:var(--f-texte);font-size:.78rem;text-transform:none;letter-spacing:0;border:0;background:none;color:var(--tampon);padding:0}
.option{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:.92rem;line-height:1.3}
.option:hover{background:var(--surface-2)}
.option input{margin:2px 0 0;accent-color:var(--tampon);flex:none;width:15px;height:15px}
.option .lib{flex:1;min-width:0;overflow-wrap:anywhere}
.option .lib small{display:block;color:var(--encre-2);font-size:.78rem;line-height:1.25}
.option .nb{font-family:var(--f-fiche);font-size:.8rem;color:var(--encre-2);font-variant-numeric:tabular-nums}
.option.zero{opacity:.5}
.groupe-prog{margin:10px 6px 3px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2)}
.dos-type{width:9px;height:15px;border-radius:2px;flex:none;margin-top:2px;background:var(--couv,var(--c-autre))}
.segment-dispo{display:flex;flex-wrap:wrap;gap:6px}

/* Barre de résultats */
.barre-resultats{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.compte{font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:1.05rem;white-space:nowrap}
.puces-actives{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;min-width:0}
.puce-active{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--tampon-fond);color:var(--tampon-fort);font-size:.83rem;line-height:1.3;border:0;max-width:100%}
.puce-active span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-active svg{width:15px;height:15px;flex:none}
.lien{border:0;background:none;padding:0;color:var(--tampon);font-weight:700;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.choix-tri{min-height:36px;padding:5px 10px;border:1px solid var(--filet-fort);border-radius:var(--r);background:var(--surface);color:var(--encre);font-size:.86rem}
.bascule{display:inline-flex;border:1px solid var(--filet-fort);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.bascule button{border:0;background:transparent;padding:6px 11px;font-size:.84rem;color:var(--encre-2);min-height:34px}
.bascule button[aria-pressed="true"]{background:var(--encre);color:var(--papier);font-weight:700}

/* Rayon de couvertures */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:26px 18px}
@media (max-width:480px){.grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.carte{display:flex;flex-direction:column;gap:7px;min-width:0}
.couverture{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;width:100%;max-width:100%;aspect-ratio:2/3;padding:12px 11px 11px 16px;border:0;border-radius:3px 7px 7px 3px;background:var(--couv,var(--c-autre));color:var(--sur-couv);text-align:left;overflow:hidden;box-shadow:var(--ombre);transition:transform .18s ease}
.couverture::before{content:"";position:absolute;top:0;bottom:0;left:0;width:6px;background:var(--dos)}
.couverture::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--trame) 1.3px,transparent 1.8px);background-size:7px 7px;-webkit-mask-image:linear-gradient(205deg,#000 0%,transparent 58%);mask-image:linear-gradient(205deg,#000 0%,transparent 58%)}
.couverture:hover{transform:translateY(-3px)}
.couverture>*{position:relative;z-index:1}
.couv-type{font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;opacity:.92}
.couv-titre{font-family:var(--f-titre);font-stretch:72%;font-weight:800;font-size:1.34rem;line-height:1.01;text-wrap:balance;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.couv-bas{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.couv-auteur{font-size:.74rem;line-height:1.2;opacity:.94;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.couv-tome{flex:none;font-family:var(--f-fiche);font-weight:700;font-size:.68rem;line-height:1.3;padding:0 6px;border:1.5px solid currentColor;border-radius:999px;white-space:nowrap}
.couv-cadre{position:absolute!important;inset:0;z-index:1;overflow:hidden;border-radius:inherit;background:var(--surface-2)}
.couv-img{position:absolute;max-width:none!important;display:block}
.couverture.avec-image .couv-type,.couverture.avec-image .couv-titre,.couverture.avec-image .couv-auteur{visibility:hidden}
.couverture.avec-image::after{display:none}
.couverture.avec-image::before{z-index:2;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.couverture.avec-image .couv-bas{z-index:2}
.couverture.avec-image .couv-tome{background:rgba(0,0,0,.66);color:#fff;border-color:transparent}
.ruban{position:absolute;z-index:3;top:12px;right:-34px;transform:rotate(38deg);background:var(--surface);color:var(--encre);font-family:var(--f-titre);font-stretch:85%;font-weight:800;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 36px;box-shadow:0 1px 2px var(--dos)}
.carte-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cote{display:inline-block;font-family:var(--f-fiche);font-weight:700;font-size:.76rem;line-height:1.35;padding:0 6px;border:1px solid var(--filet-fort);border-radius:3px;background:var(--surface);color:var(--encre);letter-spacing:.03em;white-space:nowrap}
.carte-periode{font-size:.8rem;color:var(--encre-2);line-height:1.3;overflow-wrap:anywhere}
.etat{display:inline-flex;align-items:center;gap:5px;font-size:.77rem;font-weight:700;line-height:1.25;padding:2px 8px;border-radius:999px;white-space:nowrap}
.etat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.etat.ok{color:var(--ok);background:var(--ok-fond)}
.etat.partiel{color:var(--attention);background:var(--attention-fond)}
.etat.prete{color:var(--tampon-fort);background:var(--tampon-fond)}
.etat.retard{color:var(--alerte);background:var(--alerte-fond)}
.drapeau{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px;background:var(--attention-fond);color:var(--attention)}
.drapeau.exemple{background:var(--surface-2);color:var(--encre-2)}
.plus{display:flex;justify-content:center;margin-top:26px}
.oeuvre-choisie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border:1px solid var(--tampon);border-radius:var(--r);background:var(--tampon-fond)}
.oeuvre-choisie strong{display:block;line-height:1.25}
.oeuvre-choisie span{font-size:.84rem;color:var(--encre-2)}

/* Liste */
.tableau-wrap{overflow-x:auto;border:1px solid var(--filet);border-radius:var(--r-grand);background:var(--surface)}
.tableau{width:100%;border-collapse:collapse;font-size:.9rem;min-width:780px}
.tableau th{background:var(--surface-2);text-align:left;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2);padding:9px 12px;border-bottom:1px solid var(--filet);white-space:nowrap}
.tableau td{padding:9px 12px;border-bottom:1px solid var(--filet);vertical-align:top}
.tableau tbody tr:last-child td{border-bottom:0}
.tableau tbody tr.cliquable{cursor:pointer}
.tableau tbody tr.cliquable:hover{background:var(--surface-2)}
.lien-titre{border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--encre);line-height:1.3}
.sous{display:block;font-size:.8rem;color:var(--encre-2);font-weight:400}

/* Frise */
.frise{display:flex;flex-direction:column;gap:30px;border-left:2px solid var(--filet-fort);padding-left:20px;margin-left:6px}
.frise-section>header{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;margin-bottom:14px;border-bottom:2px solid var(--encre)}
.frise-section>header::before{content:"";position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--tampon);box-shadow:0 0 0 4px var(--papier)}
.frise-section h3{margin:0;font-family:var(--f-titre);font-stretch:78%;font-weight:800;font-size:1.3rem;line-height:1.1}
.frise-dates{font-family:var(--f-fiche);color:var(--encre-2);font-size:.85rem}
.frise-nb{margin-left:auto;font-family:var(--f-fiche);font-size:.85rem;color:var(--encre-2)}
.rangee{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,138px);gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.rangee .carte{scroll-snap-align:start}
.rangee .couv-titre{font-size:1.1rem}

/* États vides */
.vide-etat{max-width:660px;margin:12px 0;padding:26px;border:2px dashed var(--filet-fort);border-radius:var(--r-grand)}
.vide-etat h2{font-family:var(--f-titre);font-stretch:78%;font-weight:800;font-size:1.6rem;line-height:1.05;margin:0 0 6px}
.vide-etat p{margin:0 0 4px;color:var(--encre-2);max-width:60ch}
.choix{display:grid;gap:10px;margin-top:18px}
.choix button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--filet);background:var(--surface);border-radius:var(--r);color:var(--encre)}
.choix button:hover{border-color:var(--tampon)}
.choix strong{display:block}
.choix span span{color:var(--encre-2);font-size:.88rem}
.choix svg{width:22px;height:22px;flex:none;color:var(--tampon);margin-top:1px}
.chargement{padding:40px 0;color:var(--encre-2);font-family:var(--f-fiche)}

/* Fiche cartonnée */
.calque{position:fixed;inset:0;z-index:50;background:var(--voile);display:flex;justify-content:flex-end}

  function telecharger(nom, contenu, mime) {
    if (lib.telechargements) {
      return lib.telechargements.save({ filename: nom, data: contenu }).then(function () { toast('Fichier enregistré : ' + nom); }, function (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast('Un téléchargement attend déjà ta confirmation.', { erreur: true }); return; }
        montrerTexte(nom, contenu);
      });
    }
    if (lib.mode === 'claude') { montrerTexte(nom, contenu); return Promise.resolve(); }
    try {
      var url = URL.createObjectURL(new Blob([contenu], { type: mime || 'application/octet-stream' }));
      var a = document.createElement('a'); a.href = url; a.download = nom; a.hidden = true;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    } catch (e) { montrerTexte(nom, contenu); }
    return Promise.resolve();
  }

  /* ================= Importations ================= */
  function lireCSV(texte) {
    texte = String(texte || '').replace(/^﻿/, '');
    var premiere = texte.split(/\r?\n/)[0] || '';
    var sep = [';', ',', '\t'].map(function (s) { return [s, premiere.split(s).length]; }).sort(function (a, b) { return b[1] - a[1]; })[0][0];
    var lignes = [], ligne = [], cel = '', guil = false;
    for (var i = 0; i < texte.length; i++) {
      var c = texte[i];
      if (guil) { if (c === '"') { if (texte[i + 1] === '"') { cel += '"'; i++; } else guil = false; } else cel += c; }
      else if (c === '"') guil = true;
      else if (c === sep) { ligne.push(cel); cel = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && texte[i + 1] === '\n') i++; ligne.push(cel); lignes.push(ligne); ligne = []; cel = ''; }
      else cel += c;
    }
    if (cel || ligne.length) { ligne.push(cel); lignes.push(ligne); }
    return lignes.filter(function (l) { return l.some(function (x) { return String(x).trim(); }); });
  }
