<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Catalogue de la bibliothèque de classe en univers social : mangas, bandes dessinées, romans graphiques et ouvrages de référence.">
<title>Bibliothèque de M. Univers social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style id="style-app">
/* Fichier de bibliothèque : barre de recherche en haut, tiroirs de filtres à gauche, rayon de couvertures à droite, fiche cartonnée qui glisse depuis la droite */
:root{
  --papier:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EBF0; --encre:#151C27; --encre-2:#55606F; --filet:#D3DAE2; --filet-fort:#B3BDC9;
  --tampon:#5A3FA6; --tampon-fort:#462F88; --tampon-fond:#ECE7F8; --sur-tampon:#FFFFFF;
  --ok:#16714A; --ok-fond:#E1F2E8; --alerte:#B3261E; --alerte-fond:#FBE6E3; --attention:#8C5006; --attention-fond:#FAEFD9;
  --voile:rgba(21,28,39,.46); --ombre:0 1px 2px rgba(21,28,39,.07),0 10px 28px rgba(21,28,39,.11);
  --trame:rgba(255,255,255,.18); --ligne-fiche:rgba(179,38,30,.55); --reglure:rgba(35,87,181,.13); --dos:rgba(0,0,0,.22);
  --c-manga:#C8412F; --c-bd:#2357B5; --c-rg:#1C6E6A; --c-jeu:#A86F0A; --c-ref:#4A6B2A; --c-roman:#7B3F6E; --c-autre:#5C6575; --sur-couv:#FFFFFF;
  --f-titre:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-texte:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-fiche:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:6px; --r-grand:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papier:#10141B; --surface:#181E28; --surface-2:#232B37; --encre:#E7EBF1; --encre-2:#9CA7B7; --filet:#2D3644; --filet-fort:#435064;
    --tampon:#B6A3F5; --tampon-fort:#CFC1FB; --tampon-fond:#2A2342; --sur-tampon:#17102B;
    --ok:#62D49D; --ok-fond:#123020; --alerte:#FF9184; --alerte-fond:#3B1714; --attention:#F0B55E; --attention-fond:#33240D;
    --voile:rgba(0,0,0,.62); --ombre:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.38);
    --trame:rgba(255,255,255,.11); --ligne-fiche:rgba(255,145,132,.5); --reglure:rgba(140,170,230,.10); --dos:rgba(0,0,0,.3);
    --c-manga:#B53B2B; --c-bd:#2B5DB8; --c-rg:#1F7672; --c-jeu:#A06A0B; --c-ref:#4F7330; --c-roman:#80456F; --c-autre:#4E5768; --sur-couv:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papier:#10141B; --surface:#181E28; --surface-2:#232B37; --encre:#E7EBF1; --encre-2:#9CA7B7; --filet:#2D3644; --filet-fort:#435064;
  --tampon:#B6A3F5; --tampon-fort:#CFC1FB; --tampon-fond:#2A2342; --sur-tampon:#17102B;
  --ok:#62D49D; --ok-fond:#123020; --alerte:#FF9184; --alerte-fond:#3B1714; --attention:#F0B55E; --attention-fond:#33240D;
  --voile:rgba(0,0,0,.62); --ombre:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.38);
  --trame:rgba(255,255,255,.11); --ligne-fiche:rgba(255,145,132,.5); --reglure:rgba(140,170,230,.10); --dos:rgba(0,0,0,.3);
  --c-manga:#B53B2B; --c-bd:#2B5DB8; --c-rg:#1F7672; --c-jeu:#A06A0B; --c-ref:#4F7330; --c-roman:#80456F; --c-autre:#4E5768; --sur-couv:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--f-texte);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-fiche);font-variant-numeric:tabular-nums}
.app{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
@media (min-width:720px){.app{padding-inline:24px}}

/* En-tête */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--papier);padding-block:14px 0;border-bottom:1px solid var(--filet)}
.entete-haut{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.marque{flex:1 1 240px;min-width:0}
.marque h1{margin:0;font-family:var(--f-titre);font-stretch:76%;font-weight:800;font-size:clamp(1.55rem,1.15rem + 1.5vw,2.15rem);line-height:1.02;letter-spacing:-.005em;text-wrap:balance;overflow-wrap:anywhere}
.sous-titre{margin:3px 0 0;color:var(--encre-2);font-family:var(--f-fiche);font-size:.84rem}
.recherche{position:relative;flex:1 1 320px;min-width:0;order:2}
.recherche svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--encre-2);pointer-events:none}
.recherche input{width:100%;min-height:44px;padding:9px 44px 9px 40px;border:1px solid var(--filet-fort);border-radius:999px;background:var(--surface);color:var(--encre);font-size:1rem}
.recherche input:focus{outline:none;border-color:var(--tampon);box-shadow:0 0 0 3px var(--tampon-fond)}
.recherche kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-fiche);font-size:.75rem;color:var(--encre-2);border:1px solid var(--filet-fort);border-radius:4px;padding:0 6px;background:var(--papier)}
.actions{display:flex;align-items:center;gap:8px;order:3}
@media (max-width:719px){.recherche{order:4;flex-basis:100%}.recherche kbd{display:none}}
.onglets{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.onglet{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.8rem;padding:9px 14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--encre-2);margin-bottom:-1px;white-space:nowrap}
.onglet[aria-selected="true"]{background:var(--surface);border-color:var(--filet);color:var(--encre)}
.onglet .nb{font-family:var(--f-fiche);font-weight:700;letter-spacing:0;text-transform:none;font-size:.78rem;padding:0 6px;border-radius:999px;background:var(--surface-2)}
.onglet .nb.alerte{background:var(--alerte-fond);color:var(--alerte)}
.bandeau{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--tampon-fond);color:var(--encre);font-size:.92rem}
.bandeau.alerte{background:var(--alerte-fond)}
.bandeau p{margin:0;flex:1 1 280px;min-width:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--filet-fort);background:var(--surface);color:var(--encre);font-weight:700;font-size:.9rem;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn-primaire{background:var(--tampon);border-color:var(--tampon);color:var(--sur-tampon)}
.btn-primaire:hover{background:var(--tampon-fort);border-color:var(--tampon-fort)}
.btn-discret{background:transparent;border-color:transparent}
.btn-discret:hover{background:var(--surface-2)}
.btn-danger{color:var(--alerte);border-color:var(--alerte)}
.btn-danger:hover{background:var(--alerte-fond)}
.btn-petit{min-height:32px;padding:4px 10px;font-size:.83rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg,.menu svg{width:17px;height:17px;flex:none}
@media (max-width:480px){.btn .txt-long{display:none}}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-grand);box-shadow:var(--ombre);padding:6px;z-index:45;display:flex;flex-direction:column}
.menu button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:6px;font-size:.92rem;color:var(--encre)}
.menu button:hover{background:var(--surface-2)}
.menu button small{display:block;color:var(--encre-2);font-size:.78rem}
.menu hr{border:0;border-top:1px solid var(--filet);margin:6px 4px}

/* Corps du catalogue */
.corps{display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;padding-top:22px}
.filtres{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--h-entete,150px) + 12px);max-height:calc(100vh - var(--h-entete,150px) - 24px);overflow:auto;padding-right:4px;padding-bottom:16px}
.filtres-tete{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.filtres-tete h2{margin:0;font-family:var(--f-titre);font-stretch:80%;font-weight:800;font-size:1.3rem}
.bouton-filtres{display:none}
@media (max-width:899px){
  .corps{grid-template-columns:minmax(0,1fr)}
  .filtres{display:none}
  .filtres.ouvert{display:block;position:fixed;inset:0;z-index:55;max-height:none;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .filtres.ouvert .filtres-tete{display:flex}
  .bouton-filtres{display:inline-flex}
}
.tiroir{border-top:1px solid var(--filet);padding-block:12px}
.tiroir:first-of-type{border-top:0;padding-top:0}
.tiroir h2{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--encre-2)}
.tiroir h2 button{font:inherit;font-family:var(--f-texte);font-size:.78rem;text-transform:none;letter-spacing:0;border:0;background:none;color:var(--tampon);padding:0}
.option{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:.92rem;line-height:1.3}
.option:hover{background:var(--surface-2)}
.option input{margin:2px 0 0;accent-color:var(--tampon);flex:none;width:15px;height:15px}
.option .lib{flex:1;min-width:0;overflow-wrap:anywhere}
.option .lib small{display:block;color:var(--encre-2);font-size:.78rem;line-height:1.25}
.option .nb{font-family:var(--f-fiche);font-size:.8rem;color:var(--encre-2);font-variant-numeric:tabular-nums}
.option.zero{opacity:.5}
.groupe-prog{margin:10px 6px 3px;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2)}
.dos-type{width:9px;height:15px;border-radius:2px;flex:none;margin-top:2px;background:var(--couv,var(--c-autre))}
.segment-dispo{display:flex;flex-wrap:wrap;gap:6px}

/* Barre de résultats */
.barre-resultats{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.compte{font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:1.05rem;white-space:nowrap}
.puces-actives{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;min-width:0}
.puce-active{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--tampon-fond);color:var(--tampon-fort);font-size:.83rem;line-height:1.3;border:0;max-width:100%}
.puce-active span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-active svg{width:15px;height:15px;flex:none}
.lien{border:0;background:none;padding:0;color:var(--tampon);font-weight:700;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.choix-tri{min-height:36px;padding:5px 10px;border:1px solid var(--filet-fort);border-radius:var(--r);background:var(--surface);color:var(--encre);font-size:.86rem}
.bascule{display:inline-flex;border:1px solid var(--filet-fort);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.bascule button{border:0;background:transparent;padding:6px 11px;font-size:.84rem;color:var(--encre-2);min-height:34px}
.bascule button[aria-pressed="true"]{background:var(--encre);color:var(--papier);font-weight:700}

/* Rayon de couvertures */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:26px 18px}
@media (max-width:480px){.grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.carte{display:flex;flex-direction:column;gap:7px;min-width:0}
.couverture{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;width:100%;max-width:100%;aspect-ratio:2/3;padding:12px 11px 11px 16px;border:0;border-radius:3px 7px 7px 3px;background:var(--couv,var(--c-autre));color:var(--sur-couv);text-align:left;overflow:hidden;box-shadow:var(--ombre);transition:transform .18s ease}
.couverture::before{content:"";position:absolute;top:0;bottom:0;left:0;width:6px;background:var(--dos)}
.couverture::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--trame) 1.3px,transparent 1.8px);background-size:7px 7px;-webkit-mask-image:linear-gradient(205deg,#000 0%,transparent 58%);mask-image:linear-gradient(205deg,#000 0%,transparent 58%)}
.couverture:hover{transform:translateY(-3px)}
.couverture>*{position:relative;z-index:1}
.couv-type{font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;opacity:.92}
.couv-titre{font-family:var(--f-titre);font-stretch:72%;font-weight:800;font-size:1.34rem;line-height:1.01;text-wrap:balance;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.couv-bas{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.couv-auteur{font-size:.74rem;line-height:1.2;opacity:.94;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.couv-tome{flex:none;font-family:var(--f-fiche);font-weight:700;font-size:.68rem;line-height:1.3;padding:0 6px;border:1.5px solid currentColor;border-radius:999px;white-space:nowrap}
.couv-cadre{position:absolute!important;inset:0;z-index:1;overflow:hidden;border-radius:inherit;background:var(--surface-2)}
.couv-img{position:absolute;max-width:none!important;display:block}
.couverture.avec-image .couv-type,.couverture.avec-image .couv-titre,.couverture.avec-image .couv-auteur{visibility:hidden}
.couverture.avec-image::after{display:none}
.couverture.avec-image::before{z-index:2;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.couverture.avec-image .couv-bas{z-index:2}
.couverture.avec-image .couv-tome{background:rgba(0,0,0,.66);color:#fff;border-color:transparent}
.ruban{position:absolute;z-index:3;top:12px;right:-34px;transform:rotate(38deg);background:var(--surface);color:var(--encre);font-family:var(--f-titre);font-stretch:85%;font-weight:800;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 36px;box-shadow:0 1px 2px var(--dos)}
.carte-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cote{display:inline-block;font-family:var(--f-fiche);font-weight:700;font-size:.76rem;line-height:1.35;padding:0 6px;border:1px solid var(--filet-fort);border-radius:3px;background:var(--surface);color:var(--encre);letter-spacing:.03em;white-space:nowrap}
.carte-periode{font-size:.8rem;color:var(--encre-2);line-height:1.3;overflow-wrap:anywhere}
.etat{display:inline-flex;align-items:center;gap:5px;font-size:.77rem;font-weight:700;line-height:1.25;padding:2px 8px;border-radius:999px;white-space:nowrap}
.etat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.etat.ok{color:var(--ok);background:var(--ok-fond)}
.etat.partiel{color:var(--attention);background:var(--attention-fond)}
.etat.prete{color:var(--tampon-fort);background:var(--tampon-fond)}
.etat.retard{color:var(--alerte);background:var(--alerte-fond)}
.drapeau{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px;background:var(--attention-fond);color:var(--attention)}
.drapeau.exemple{background:var(--surface-2);color:var(--encre-2)}
.plus{display:flex;justify-content:center;margin-top:26px}
.oeuvre-choisie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border:1px solid var(--tampon);border-radius:var(--r);background:var(--tampon-fond)}
.oeuvre-choisie strong{display:block;line-height:1.25}
.oeuvre-choisie span{font-size:.84rem;color:var(--encre-2)}

/* Liste */
.tableau-wrap{overflow-x:auto;border:1px solid var(--filet);border-radius:var(--r-grand);background:var(--surface)}
.tableau{width:100%;border-collapse:collapse;font-size:.9rem;min-width:780px}
.tableau th{background:var(--surface-2);text-align:left;font-family:var(--f-titre);font-stretch:85%;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2);padding:9px 12px;border-bottom:1px solid var(--filet);white-space:nowrap}
.tableau td{padding:9px 12px;border-bottom:1px solid var(--filet);vertical-align:top}
.tableau tbody tr:last-child td{border-bottom:0}
.tableau tbody tr.cliquable{cursor:pointer}
.tableau tbody tr.cliquable:hover{background:var(--surface-2)}
.lien-titre{border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--encre);line-height:1.3}
.sous{display:block;font-size:.8rem;color:var(--encre-2);font-weight:400}

/* Frise */
.frise{display:flex;flex-direction:column;gap:30px;border-left:2px solid var(--filet-fort);padding-left:20px;margin-left:6px}
.frise-section>header{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;margin-bottom:14px;border-bottom:2px solid var(--encre)}
.frise-section>header::before{content:"";position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--tampon);box-shadow:0 0 0 4px var(--papier)}
.frise-section h3{margin:0;font-family:var(--f-titre);font-stretch:78%;font-weight:800;font-size:1.3rem;line-height:1.1}
.frise-dates{font-family:var(--f-fiche);color:var(--encre-2);font-size:.85rem}
.frise-nb{margin-left:auto;font-family:var(--f-fiche);font-size:.85rem;color:var(--encre-2)}
.rangee{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,138px);gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.rangee .carte{scroll-snap-align:start}
.rangee .couv-titre{font-size:1.1rem}

/* États vides */
.vide-etat{max-width:660px;margin:12px 0;padding:26px;border:2px dashed var(--filet-fort);border-radius:var(--r-grand)}
.vide-etat h2{font-family:var(--f-titre);font-stretch:78%;font-weight:800;font-size:1.6rem;line-height:1.05;margin:0 0 6px}
.vide-etat p{margin:0 0 4px;color:var(--encre-2);max-width:60ch}
.choix{display:grid;gap:10px;margin-top:18px}
.choix button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--filet);background:var(--surface);border-radius:var(--r);color:var(--encre)}
.choix button:hover{border-color:var(--tampon)}
.choix strong{display:block}
.choix span span{color:var(--encre-2);font-size:.88rem}
.choix svg{width:22px;height:22px;flex:none;color:var(--tampon);margin-top:1px}

  function telecharger(nom, contenu, mime) {

      return lib.telechargements.save({ filename: nom, data: contenu }).then(function () { toast('Fichier enregistré : ' + nom); }, function (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast('Un téléchargement attend déjà ta confirmation.', { erreur: true }); return; }
        montrerTexte(nom, contenu);
      });
    }
    if (lib.mode === 'claude') { montrerTexte(nom, contenu); return Promise.resolve(); }
    try {
      var url = URL.createObjectURL(new Blob([contenu], { type: mime || 'application/octet-stream' }));
      var a = document.createElement('a'); a.href = url; a.download = nom; a.hidden = true;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    } catch (e) { montrerTexte(nom, contenu); }
    return Promise.resolve();
  }

  /* ================= Importations ================= */
  function lireCSV(texte) {
    texte = String(texte || '').replace(/^﻿/, '');
    var premiere = texte.split(/\r?\n/)[0] || '';
    var sep = [';', ',', '\t'].map(function (s) { return [s, premiere.split(s).length]; }).sort(function (a, b) { return b[1] - a[1]; })[0][0];

    for (var i = 0; i < texte.length; i++) {
      var c = texte[i];
      if (guil) { if (c === '"') { if (texte[i + 1] === '"') { cel += '"'; i++; } else guil = false; } else cel += c; }
      else if (c === '"') guil = true;
      else if (c === sep) { ligne.push(cel); cel = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && texte[i + 1] === '\n') i++; ligne.push(cel); lignes.push(ligne); ligne = []; cel = ''; }
      else cel += c;
    }
    if (cel || ligne.length) { ligne.push(cel); lignes.push(ligne); }

  }

    niveaux: ['niveau', 'niveaux'], exemplaires: ['exemplaires', 'quantite', 'nombre', 'copies', 'qte', 'nb'], cote: ['cote'], emplacement: ['emplacement', 'rayon', 'etagere', 'localisation', 'lieu'],

    }

  }
  var TYPES_COURANTS = { 'bande dessinee': 'bd', 'bandes dessinees': 'bd', 'documentaire': 'reference', 'essai': 'reference', 'reference': 'reference', 'roman': 'roman', 'recit': 'roman', 'temoignage': 'roman', 'livre dont vous etes le heros': 'livre-jeu', 'livre-jeu': 'livre-jeu', 'ldvh': 'livre-jeu', 'comics': 'bd' };

  function ouvrirImport() {

  function afficherApercu(m, html, pret) {

  function analyserImport(m, texte, nom) {
    m.plan = null;

      var remplacees = oeuvres.filter(function (w) { return lib.oeuvres.has(w.id); }).length;
      m.plan = { type: 'json', oeuvres: oeuvres, prets: peutModifier() ? prets : [], reglages: d.reglages || null };
      return afficherApercu(m, '<p class="indice info">Sauvegarde du ' + esc(fmtDate(String(d.exporteLe || '').slice(0, 10)) || 'jour inconnu') + ' : ' + plur(oeuvres.length, 'fiche', 'fiches') + ', ' + plur(prets.length, 'prêt', 'prêts') + (d.reglages ? ' et les réglages' : '') + '.' +
        (remplacees ? ' ' + plur(remplacees, 'fiche existante sera remplacée', 'fiches existantes seront remplacées') + ' par leur version sauvegardée.' : '') + '</p>' +
        (d.reglages ? '<label class="case" style="margin-top:10px"><input type="checkbox" id="f-avec-reglages" checked><span>Restaurer aussi les réglages (types, périodes, programme)</span></label>' : ''), oeuvres.length > 0);

      '</tbody></table></div>' + (oeuvresCSV.length > 6 ? '<p class="aide" style="margin-top:6px">Aperçu des 6 premières lignes.</p>' : ''), oeuvresCSV.length > 0);

  /* Fichier de résumés : ne touche qu’au résumé, à sa source et à son lien, fiche par fiche (identifiant, sinon ISBN) */
  function analyserResumes(m, liste) {
    var parIsbn = new Map();

      (apercu.length ? '<div class="revue-wrap"><table class="revue"><thead><tr><th>Titre</th><th>Résumé</th><th>Source</th></tr></thead><tbody>' + apercu.map(function (w) {

  function executerImport(m) {

  /* ================= GitHub : catalogue public et gestion avec un jeton =================
     Le dépôt public (ex. bibliotheque) sert la page des élèves et son catalogue.json, sans noms ni notes.
     Le dépôt privé (ex. bibliotheque-donnees) garde les fiches complètes, les prêts et les réglages :

  var API_GITHUB = 'https://api.github.com';

    { envoi: 1200, reprise: 5000, publication: 5 * 60000, publicationErreur: 5 * 60000 };
  var FICHIER_PRIVE = /^(catalogue|registre|config)\/[A-Za-z0-9._-]{1,120}\.json$/;

  function lireConfigGithub() {
    var el = document.getElementById('config-github'); if (!el) return null;
    var c; try { c = JSON.parse(el.textContent); } catch (e) { return null; }
    if (!isPlain(c)) return null;
    var compte = String(c.compte || ''), depot = String(c.depot || '');
    try {
      var seg = location.pathname.split('/').filter(Boolean);
      if (/\.github\.io$/i.test(location.hostname) && seg.length && seg[0].indexOf('.') < 0) { compte = location.hostname.split('.')[0]; depot = seg[0]; }
    } catch (e) { /* adresse inconnue : la configuration fait foi */ }

    if (!/^[A-Za-z0-9-]{1,39}$/.test(compte) || !nom.test(depot) || !nom.test(prive)) return null;
    return { compte: compte, depot: depot, prive: prive, branche: /^[A-Za-z0-9._\/-]{1,100}$/.test(c.branche || '') ? c.branche : 'main' };
  }

  /* Jeton : propre à ce dépôt, car tous les sites d’un même compte partagent le stockage du navigateur */
  function cleJeton(g) { return 'biblio_admin_token::' + g.compte + '/' + g.depot; }
  function lireJeton(g) { try { return localStorage.getItem(cleJeton(g)) || sessionStorage.getItem(cleJeton(g)) || ''; } catch (e) { return ''; } }
  function oublierJeton(g) {
    try { localStorage.removeItem(cleJeton(g)); } catch (e) { /* ignoré */ }
    try { sessionStorage.removeItem(cleJeton(g)); } catch (e) { /* ignoré */ }
  }
  function garderJeton(g, jeton, memoriser) {
    oublierJeton(g);
    try { (memoriser ? localStorage : sessionStorage).setItem(cleJeton(g), jeton); } catch (e) { /* stockage indisponible */ }
  }

  function versBase64(texte) { return btoa(unescape(encodeURIComponent(texte))); }

  function heure(t) { var d = new Date(t); return d.getHours() + ' h ' + pad(d.getMinutes()); }

  /* ----- Appels à l’API ----- */
  function erreurGithub(statut, message) { var e = new Error(message || 'GitHub ' + statut); e.code = 'github'; e.statut = statut; return e; }
  function appelGithub(jeton, methode, chemin, corps) {
    var o = { method: methode, cache: 'no-store', headers: { Authorization: 'Bearer ' + jeton, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
    if (corps) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
    return fetch(API_GITHUB + chemin, o).then(function (r) {
      if (r.ok) return r.status === 204 ? null : r.json().catch(function () { return null; });
      return r.json().catch(function () { return {}; }).then(function (j) {

  }
  function messageGithub(e, g) {
    g = g || lib.githubCfg || { compte: '', depot: '', prive: '' };
    var s = e && e.statut;
    if (e && e.code === 'depot-public') return 'Le dépôt ' + g.prive + ' est public : les noms des emprunteurs y seraient visibles. Rends-le privé dans ses réglages GitHub (Settings, puis Change visibility), puis reconnecte-toi.';
    if (s === 401) return 'Jeton refusé (401). Vérifie qu’il est valide et non expiré.';

    }).then(function () { toast('Couverture ajoutée'); }, function (e) {
      var code = e && e.code;
      toast(code === 'github' ? 'La couverture n’a pas pu être ajoutée. ' + messageGithub(e, lib.githubCfg) : code === 'quota_exceeded' || code === 'too_large' ? 'Espace de stockage plein ou image trop lourde.' : code === 'not_writer' || code === 'not_granted' ? 'Tu n’as pas la permission d’ajouter des images ici.' : 'La couverture n’a pas pu être ajoutée.', { erreur: true, duree: 7000 });
    });
  }
  function retirerCouverture(id) {
    var w = lib.oeuvres.get(id); if (!w || !w.couv) return;
    var avant = clone(w.couv), c = clone(w); c.couv = null; c.modifieLe = new Date().toISOString();
    enregistrerOeuvres([c]).then(function () {
      toast('Couverture retirée', { action: { label: 'Annuler', fn: function () { var x = lib.oeuvres.get(id); if (!x) return; var y = clone(x); y.couv = avant; enregistrerOeuvres([y]).catch(echec); } } });
    }).catch(echec);
  }

  /* ================= Exemples ================= */
  function effacerExemples() {
    var oeuvres = [], prets = [];
    lib.oeuvres.forEach(function (w) { if (w.exemple) oeuvres.push(w.id); });
    lib.prets.forEach(function (p) { if (p.exemple || oeuvres.indexOf(p.oeuvreId) > -1) prets.push(p.id); });
    if (!oeuvres.length && !prets.length) return;
    confirmer({ titre: 'Effacer les exemples ?', message: plur(oeuvres.length, 'fiche d’exemple', 'fiches d’exemple') + ' et ' + plur(prets.length, 'prêt d’exemple', 'prêts d’exemple') + ' seront supprimés. Tes propres fiches ne sont pas touchées.', bouton: 'Effacer', danger: true }).then(function (ok) {
      if (!ok) return;
      (prets.length ? supprimerPrets(prets) : Promise.resolve()).then(function () { return oeuvres.length ? supprimerOeuvres(oeuvres) : null; })
        .then(function () { toast('Exemples effacés'); }).catch(echec);
    });
  }

  /* ================= Gabarit et rendu général ================= */
  var GABARIT = '<div class="app" lang="fr"><header class="entete" id="entete"><div class="entete-haut">' +
    '<div class="marque"><h1 id="nom-biblio"></h1><p class="sous-titre" id="resume-biblio">Ouverture du fichier…</p></div>' +
    '<div class="recherche" role="search">' + icone('loupe') + '<label class="vh" for="q">Rechercher dans le catalogue</label><input id="q" type="search" autocomplete="off" placeholder="Titre, auteur, sujet, cote…"><kbd>/</kbd></div>' +
    '<div class="actions" id="actions-entete"></div></div><div class="onglets" id="onglets" role="tablist" hidden></div></header>' +
    '<div class="bandeau" id="bandeau" hidden></div>' +
    '<main class="corps" id="vue-catalogue"><aside class="filtres" id="filtres" aria-label="Filtres"></aside><section aria-label="Résultats" style="min-width:0"><div class="barre-resultats" id="barre-resultats"></div><div id="resultats"></div></section></main>' +
    '<main id="vue-prets" hidden></main></div><div id="calque-fiche"></div><div id="modales"></div><div class="toasts" id="toasts"></div>';
  function mesurerEntete() { var e = $('#entete'); if (e) document.documentElement.style.setProperty('--h-entete', e.offsetHeight + 'px'); }
  function cleFocus(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + el.id;
    if (el.getAttribute('data-facette')) return '[data-facette="' + el.getAttribute('data-facette') + '"][value="' + String(el.value).replace(/"/g, '\\"') + '"]';
    if (el.getAttribute('data-action') && el.getAttribute('data-valeur') != null) return '[data-action="' + el.getAttribute('data-action') + '"][data-valeur="' + String(el.getAttribute('data-valeur')).replace(/"/g, '\\"') + '"]';
    return null;
  }
  function garderFocus(fn) {
    var cle = cleFocus(document.activeElement);
    fn();
    if (cle && !pileModales.length) { try { var el = $(cle); if (el && el !== document.activeElement) el.focus(); } catch (e) { /* sélecteur invalide */ } }
  }
  function rendreCatalogue() { garderFocus(function () { rendreFiltres(); rendreResultats(); }); }
  function rendreTout() {
    garderFocus(function () {
      rendreEntete();
      var prets = etat.onglet === 'prets' && verifiePrets();
      if (!prets) etat.onglet = 'catalogue';
      $('#vue-catalogue').hidden = prets;
      $('#vue-prets').hidden = !prets;
      if (prets) rendrePrets(); else { rendreFiltres(); rendreResultats(); }
      rendreFiche();
    });
    mesurerEntete();
  }
  function donneesChangees() { reconstruireIndex(); reconcilier(); rendreTout(); }
  function ouvrirFiche(id) {
    if (!lib.oeuvres.has(id)) return;
    etat.ficheOrigine = document.activeElement;
    etat.ficheId = id;
    rendreFiche();
  }
  function fermerFiche() {
    etat.ficheId = null;
    rendreFiche();
    var o = etat.ficheOrigine; etat.ficheOrigine = null;
    if (o && document.contains(o)) { try { o.focus(); } catch (e) { /* ignoré */ } }
  }
  function changerOnglet(o) {
    etat.onglet = o; etat.menuOuvert = false;
    if (etat.ficheId) { etat.ficheId = null; }
    rendreTout();
    try { window.scrollTo(0, 0); } catch (e) { /* jsdom */ }
  }

  /* ================= Événements ================= */
  var filtrerPlusTard = debounce(function () { etat.limite = 60; rendreCatalogue(); }, 140);
  var filtrerPretsPlusTard = debounce(function () { rendreListePrets(); }, 140);
  function brancherEvenements() {
    document.addEventListener('click', function (e) {
      if (etat.menuOuvert && !e.target.closest('.menu-wrap')) { etat.menuOuvert = false; rendreEntete(); }
      if (e.target.closest('#modales')) return;
      var el = e.target.closest('[data-action]'); if (!el) return;
      var a = el.getAttribute('data-action'), id = el.getAttribute('data-id'), v = el.getAttribute('data-valeur'), pret = el.getAttribute('data-pret');
      if (a === 'fond-fiche' && e.target !== el) return;
      if (el.tagName === 'A') e.preventDefault();
      if (a !== 'menu' && el.closest('.menu')) { etat.menuOuvert = false; rendreEntete(); }
      switch (a) {
        case 'fiche': ouvrirFiche(id); break;
        case 'fermer-fiche': case 'fond-fiche': fermerFiche(); break;
        case 'ajouter': ouvrirFormOeuvre(); break;
        case 'modifier': ouvrirFormOeuvre(id); break;
        case 'supprimer': supprimerOeuvre(id); break;
        case 'marquer-verifiee': marquerVerifiee(id); break;
        case 'preter': ouvrirFormPret({ oeuvreId: id }); break;
        case 'nouveau-pret': ouvrirFormPret(); break;
        case 'retour': marquerRendu(pret); break;
        case 'prolonger': prolonger(pret, 7); break;
        case 'modifier-pret': if (lib.prets.get(pret)) ouvrirFormPret({ pret: lib.prets.get(pret) }); break;
        case 'supprimer-pret': supprimerPret(pret); break;
        case 'menu': etat.menuOuvert = !etat.menuOuvert; rendreEntete(); if (etat.menuOuvert) { var b = $('.menu button'); if (b) b.focus(); } break;
        case 'ajout-rapide': ouvrirAjoutRapide(); break;
        case 'importer': ouvrirImport(); break;
        case 'exporter': ouvrirExport(); break;
        case 'reglages': ouvrirReglages(); break;
        case 'effacer-exemples': effacerExemples(); break;
        case 'onglet': changerOnglet(v); break;
        case 'vue': etat.vue = v; lsSet('biblio.vue', v); etat.limite = 60; rendreCatalogue(); break;
        case 'plus': etat.limite += 60; rendreResultats(); break;
        case 'retirer-filtre':
          var f = el.getAttribute('data-facette');
          if (f === 'q') { etat.q = ''; etat.jetons = []; $('#q').value = ''; }
          else if (f === 'dispo') etat.f.dispo = 'tous';
          else if (f === 'verif') etat.f.verif = false;
          else if (etat.f[f]) etat.f[f].delete(v);
          etat.limite = 60; rendreCatalogue(); break;
        case 'vider-facette':
          var g = el.getAttribute('data-facette');
          if (g === 'dispo') etat.f.dispo = 'tous'; else if (g === 'verif') etat.f.verif = false; else if (etat.f[g]) etat.f[g].clear();
          rendreCatalogue(); break;
        case 'effacer-filtres':
          ['types', 'periodes', 'programme', 'sujets', 'niveaux'].forEach(function (k) { etat.f[k].clear(); });
          etat.f.dispo = 'tous'; etat.f.verif = false; etat.q = ''; etat.jetons = []; $('#q').value = ''; etat.limite = 60; rendreCatalogue(); break;
        case 'filtrer-par':
          var fac = el.getAttribute('data-facette');
          ['types', 'periodes', 'programme', 'sujets', 'niveaux'].forEach(function (k) { etat.f[k].clear(); });
          etat.f.dispo = 'tous'; etat.f.verif = false; etat.q = ''; etat.jetons = []; $('#q').value = '';
          if (etat.f[fac]) etat.f[fac].add(v);
          etat.ficheId = null; etat.ficheOrigine = null; etat.onglet = 'catalogue'; etat.limite = 60; rendreTout();
          toast('Catalogue filtré');
          break;
        case 'sujets-tous': etat.sujetsTous = !etat.sujetsTous; rendreFiltres(); break;
        case 'ouvrir-filtres': etat.filtresOuverts = true; rendreFiltres(); var x = $('#filtres input'); if (x) x.focus(); break;
        case 'fermer-filtres': etat.filtresOuverts = false; rendreFiltres(); break;
        case 'segment-prets': etat.segmentPrets = v; rendreListePrets(); break;
        case 'filtrer-emprunteur': etat.qPrets = v; etat.segmentPrets = 'tous'; var qp = $('#q-prets'); if (qp) qp.value = v; rendreListePrets(); break;
        case 'retirer-couv': retirerCouverture(id); break;
        case 'github': ouvrirGithub(); break;
        case 'github-reconnecter': ouvrirConnexion(); break;
        case 'effacer-recherche-prets': etat.qPrets = ''; etat.catPrets = ''; var q2 = $('#q-prets'); if (q2) q2.value = ''; var c2 = $('#cat-prets'); if (c2) c2.value = ''; rendreListePrets(); break;
      }
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.closest('#modales')) return;
      var fac = t.getAttribute('data-facette');
      if (fac) {
        if (fac === 'dispo') etat.f.dispo = t.value;
        else if (fac === 'verif') etat.f.verif = t.checked;
        else if (etat.f[fac]) { if (t.checked) etat.f[fac].add(t.value); else etat.f[fac].delete(t.value); }
        etat.limite = 60; rendreCatalogue(); return;
      }
      if (t.id === 'tri') { etat.tri = t.value; lsSet('biblio.tri', t.value); rendreResultats(); }
      if (t.id === 'cat-prets') { etat.catPrets = t.value; rendreListePrets(); }
      if (t.id === 'f-couv-fichier' && t.files && t.files[0]) televerserCouverture(t.getAttribute('data-id'), t.files[0]);
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.id === 'q') { etat.q = t.value.trim(); etat.jetons = norm(t.value).split(' ').filter(Boolean); if (etat.onglet !== 'catalogue') changerOnglet('catalogue'); filtrerPlusTard(); }
      if (t.id === 'q-prets') { etat.qPrets = t.value; filtrerPretsPlusTard(); }
    });
    document.addEventListener('keydown', function (e) {
      var champ = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
      if (e.key === 'Escape') {
        if (pileModales.length) { e.preventDefault(); fermerModale(); return; }
        if (etat.ficheId) { e.preventDefault(); fermerFiche(); return; }
        if (etat.menuOuvert) { etat.menuOuvert = false; rendreEntete(); return; }
        if (etat.filtresOuverts) { etat.filtresOuverts = false; rendreFiltres(); return; }
      }
      if (e.key === '/' && !champ && !pileModales.length && !e.ctrlKey && !e.metaKey) { e.preventDefault(); if (etat.ficheId) fermerFiche(); var q = $('#q'); if (q) q.focus(); }
    });
    window.addEventListener('resize', debounce(mesurerEntete, 120));
    document.addEventListener('error', function (e) {
      var t = e.target;
      if (!t || !t.classList || !t.classList.contains('couv-img')) return;
      var c = t.closest('.couverture'); if (c) c.classList.remove('avec-image');
      var cadre = t.parentNode; if (cadre && cadre.parentNode) cadre.parentNode.removeChild(cadre);
    }, true);
  }

  /* ================= Démarrage ================= */
  function abonner() {
    lib.abonnements.forEach(function (u) { try { u(); } catch (e) { /* ignoré */ } });
    lib.abonnements = [];
    function surErreur(e) {
      if (window.console) console.error(e);
      lib.avis = e && e.code === 'revoked' ? 'L’accès à la bibliothèque a été retiré pour cette page.' : 'La synchronisation s’est interrompue. Recharge la page pour la reprendre.';
      rendreEntete();
    }
    lib.abonnements.push(lib.db.collection('catalogue').onSnapshot(function (snap) {
      rayons.oeuvres.appliquer(snap);
      var m = new Map(); rayons.oeuvres.items.forEach(function (it, id) { m.set(id, normaliserOeuvre(it.valeur, id)); });
      lib.oeuvres = m; lib.charge.catalogue = true;
      if (!snap.metadata || !snap.metadata.fromCache) lib.definitif.catalogue = true;
      if (lib.statut === 'chargement') lib.statut = 'pret';
      if (etat.ficheId && !m.has(etat.ficheId)) etat.ficheId = null;
      donneesChangees();
    }, surErreur));
    lib.abonnements.push(lib.db.doc('config/reglages').onSnapshot(function (d) {
      lib.reglagesExistent = d.exists; lib.reglages = normaliserReglages(d.exists ? d.data() : null); lib.charge.config = true;
      donneesChangees();
    }, surErreur));
    if (lib.role === 'admin') lib.abonnements.push(lib.db.collection('registre').onSnapshot(function (snap) {
      rayons.prets.appliquer(snap);
      var m = new Map(); rayons.prets.items.forEach(function (it, id) { m.set(id, normaliserPret(it.valeur, id)); });
      lib.prets = m; lib.actifs = calculerActifs(m); lib.charge.registre = true;
      if (!snap.metadata || !snap.metadata.fromCache) lib.definitif.registre = true;
      donneesChangees();
    }, surErreur));
  }
  function demarrerLocal() {
    lib.mode = 'local'; lib.role = 'admin';
    lib.db = creerBaseMemoire(window.__BIBLIO_TEST__ ? null : 'bibliotheque-univers-social.v1');
    abonner();
  }
  function demarrerPublic(d) {
    lib.mode = 'public'; lib.role = 'lecteur';
    lib.reglages = normaliserReglages(d.reglages);
    if (d.nom) lib.reglages.nom = String(d.nom).slice(0, 120);
    lib.publicInfo = { genereLe: /^\d{4}-\d{2}-\d{2}$/.test(d.genereLe || '') ? d.genereLe : '' };
    var m = new Map();
    (Array.isArray(d.oeuvres) ? d.oeuvres : []).forEach(function (o) { var w = normaliserOeuvre(o, o && o.id); m.set(w.id, w); });
    lib.oeuvres = m; lib.statut = 'pret'; lib.charge.catalogue = true;
    donneesChangees();
  }
  function demarrerClaude() {
    lib.mode = 'claude';
    var c = window.claude;
    Promise.all([c.use('db'), c.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) { lib.statut = 'indisponible'; rendreTout(); return; }
      lib.db = db;
      var roles = user ? Promise.all([user.isOwner(), user.canEdit(), user.can('data.write')]) : Promise.resolve([false, false, null]);
      return roles.then(function (x) {
        lib.role = x[0] || x[1] || x[2] === true ? 'admin' : 'lecteur';
        abonner();
        c.use('downloads').then(function (d) { lib.telechargements = d; }, function () {});
        if (lib.role === 'admin') c.use('assets').then(function (a) { lib.assets = a; rendreFiche(); }, function () {});
        if (lib.role !== 'admin') return;
        c.use('sample').then(function (s) {
          if (!s) return;
          lib.sample = s;
          return Promise.resolve(s.limits ? s.limits() : null).then(function (l) { lib.imagesClaude = l && l.images ? l.images : null; }, function () { lib.imagesClaude = null; });
        }).then(function () { rendreEntete(); }, function () {});
      });
    }).catch(function (e) { if (window.console) console.error(e); lib.statut = 'indisponible'; rendreTout(); });
  }
  function demarrer() {
    var racine = document.getElementById('racine');
    if (!racine) { racine = document.createElement('div'); racine.id = 'racine'; document.body.appendChild(racine); }
    if (!racine.firstChild) racine.innerHTML = GABARIT;
    brancherEvenements();
    rendreTout();
    var pub = document.getElementById('donnees-publiques');
    if (pub) { try { demarrerPublic(JSON.parse(pub.textContent)); } catch (e) { lib.statut = 'indisponible'; rendreTout(); } return; }
    var gcfg = lireConfigGithub();
    if (window.claude && typeof window.claude.use === 'function') demarrerClaude();
    else if (gcfg) demarrerGithub(gcfg);
    else demarrerLocal();
  }
  if (window.__BIBLIO_TEST__) window.__biblio = { lib: lib, etat: etat, rayons: rayons, creerBaseMemoire: creerBaseMemoire, pagePublique: pagePublique, donneesPubliques: donneesPubliques, synchroniser: synchroniser, csvCatalogue: csvCatalogue, csvPrets: csvPrets, sauvegardeJSON: sauvegardeJSON, lireCSV: lireCSV, analyserImport: analyserImport, normaliserOeuvre: normaliserOeuvre, coteDe: coteDe, dispoDe: dispoDe };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();
})();
</script>
